  <text x="340" y="360" fill="#5e625c" font-size="14" font-family="ui-sans-serif, Segoe UI, sans-serif">主题已应用到宿主 token。设置 → 主题 → Craftdesk 方野。</text>
  <text x="340" y="388" fill="#5e625c" font-size="14" font-family="ui-sans-serif, Segoe UI, sans-serif">BoutiqueBitmap 负责中文界面，JetBrains Mono 只留给代码。</text>
  <rect x="292" y="568" width="956" height="120" rx="6" fill="#fcfaf5" stroke="rgba(50,54,49,0.18)"/>
  <rect x="292" y="568" width="956" height="120" fill="none" stroke="#6f6458" stroke-width="1" opacity="0.35"/>
  <text x="320" y="622" fill="#686d66" font-size="15" font-family="ui-sans-serif, Segoe UI, sans-serif">问一问方野工作台…</text>
  <rect x="1148" y="604" width="72" height="48" rx="4" fill="#4f7434"/>
  <text x="1166" y="634" fill="#fcfaf5" font-size="14" font-family="ui-sans-serif, Segoe UI, sans-serif">发送</text>
