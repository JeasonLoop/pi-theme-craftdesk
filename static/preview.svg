<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Craftdesk Fangye workbench preview">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(67,70,65,0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f6f1"/>
      <stop offset="1" stop-color="#f1eee7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#paper)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="0" y="0" width="268" height="720" fill="#292b29"/>
  <rect x="0" y="0" width="4" height="720" fill="#4f7434"/>
  <text x="28" y="48" fill="#f6f4ef" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="18">CRAFTDESK</text>
  <text x="28" y="72" fill="#78945f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="12">方野 · pixel workbench</text>
  <rect x="18" y="108" width="232" height="44" rx="4" fill="#1f211f"/>
  <rect x="18" y="108" width="4" height="44" fill="#4f7434"/>
  <text x="36" y="128" fill="#eceae4" font-size="13" font-family="ui-sans-serif, Segoe UI, sans-serif">今日排期</text>
  <text x="36" y="146" fill="#8b9088" font-size="11" font-family="ui-sans-serif, Segoe UI, sans-serif">12:04</text>
  <text x="36" y="188" fill="#c9cdc4" font-size="13" font-family="ui-sans-serif, Segoe UI, sans-serif">主题插件发布</text>
  <text x="36" y="206" fill="#6f746c" font-size="11" font-family="ui-sans-serif, Segoe UI, sans-serif">昨天</text>
  <text x="36" y="240" fill="#c9cdc4" font-size="13" font-family="ui-sans-serif, Segoe UI, sans-serif">字体对齐微调</text>
  <rect x="292" y="28" width="956" height="520" rx="6" fill="#fcfaf5" stroke="rgba(50,54,49,0.16)"/>
  <rect x="292" y="28" width="956" height="8" fill="#4f7434"/>
  <text x="320" y="72" fill="#292b29" font-size="22" font-family="ui-sans-serif, Segoe UI, sans-serif">把像素世界的材质感收进日常工作界面</text>
  <text x="320" y="108" fill="#5e625c" font-size="15" font-family="ui-sans-serif, Segoe UI, sans-serif">暖灰制图网格 · 炭黑导航 · 草绿只用于状态和焦点</text>
  <rect x="320" y="140" width="720" height="120" rx="4" fill="#eeece6"/>
  <text x="340" y="176" fill="#292b29" font-size="14" font-family="ui-monospace, Consolas, monospace">:root[data-theme="light"] {</text>
  <text x="360" y="200" fill="#4f7434" font-size="14" font-family="ui-monospace, Consolas, monospace">--ds-bg-primary: #f6f4ef;</text>
  <text x="360" y="224" fill="#4f7434" font-size="14" font-family="ui-monospace, Consolas, monospace">--ds-accent: #4f7434;</text>
  <text x="340" y="248" fill="#292b29" font-size="14" font-family="ui-monospace, Consolas, monospace">}</text>
  <rect x="320" y="292" width="880" height="210" rx="4" fill="#f6f4ef" stroke="rgba(50,54,49,0.12)"/>
