<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pi-plugin-chrome" content="v3">
<title>Craftdesk 方野</title>
<style>
  @font-face { font-family:CraftdeskBoutique; src:url("../fonts/BoutiqueBitmap9x9.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:CraftdeskMono; src:url("../fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-display:swap; }
  :root { color-scheme: light; --paper:#f8f5f0; --line:#e1d7cc; --ink:#302b26; --charcoal:#2d2d2d; --grass:#5d8c2e; --wood:#8b5e3c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:22px; color:var(--ink); font:14px/1.65 CraftdeskBoutique,"Noto Sans SC",sans-serif; background-color:var(--paper); background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:24px 24px; }
  main { border:1px solid rgba(48,43,38,.18); border-radius:9px; background:#fcfaf5; box-shadow:0 18px 50px rgba(65,45,29,.12); overflow:hidden; }
  header { padding:15px 18px; color:#f8f5f0; background:var(--charcoal); border-bottom:3px solid var(--grass); }
  h1 { margin:0; font-size:19px; line-height:1.3; font-weight:400; letter-spacing:.02em; }
  .body { padding:18px; }
  p { margin:0 0 14px; color:#62594f; }
  ul { margin:0; padding:0; list-style:none; }
  li { padding:8px 0; border-top:1px solid var(--line); }
  code { padding:2px 6px; color:#385a20; background:rgba(93,140,46,.12); border:1px solid rgba(93,140,46,.25); border-radius:3px; font-family:CraftdeskMono,Consolas,monospace; }
</style>
</head>
<body>
<main>
  <header><h1>Craftdesk 方野</h1></header>
  <div class="body">
    <p>把像素世界的材质感收进日常工作界面，不复制游戏 UI。</p>
    <ul>
      <li>暖灰制图网格与炭黑导航</li>
      <li>草绿状态色与克制层级</li>
      <li>BoutiqueBitmap 中文点阵字体</li>
      <li>设置 → 主题 → <code>Craftdesk 方野</code></li>
    </ul>
  </div>
</main>
</body>
</html>
